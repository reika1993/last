<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこ一覧</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>

<h1>🐱 ねこ一覧</h1>

<table>
    <thead>
    <tr>
        <th>名前</th>
        <th>性別</th>
        <th>年齢</th>
    </tr>
    </thead>

    <tbody id="cat-list">
    <!-- JavaScriptで猫のデータを表示する -->
    </tbody>
</table>

<script>
    // 猫一覧を取得する
    fetch("/cats")
        .then(response => response.json())
        .then(cats => {

            const catList = document.getElementById("cat-list");

            cats.forEach(cat => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${cat.name}</td>
                    <td>${cat.sex}</td>
                    <td>${cat.age}歳</td>
                `;

                catList.appendChild(row);
            });
        })
        .catch(error => {
            console.error("猫の一覧取得に失敗しました", error);
        });
</script>

</body>
</html>
