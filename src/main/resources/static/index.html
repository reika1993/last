<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ねこ管理システム</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 28px 16px;
            background: #f5f6f8;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans JP", sans-serif;
        }

        main { max-width: 900px; margin: auto; }

        h1 { margin-bottom: 8px; }
        h2 { font-size: 18px; margin-top: 0; }

        .subtitle { color: #777; margin-top: 0; }

        section {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 14px;
            box-shadow: 0 2px 8px #0000000a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input, select, button {
            font: inherit;
            border-radius: 8px;
            padding: 10px;
        }

        input, select {
            width: 100%;
            border: 1px solid #d5d8de;
            background: white;
        }

        button {
            border: none;
            cursor: pointer;
            background: #426b59;
            color: white;
        }

        button:hover { opacity: .85; }
        button:disabled { opacity: .5; cursor: wait; }

        .primary { margin-top: 16px; }
        .secondary { background: #e9edf0; color: #333; }
        .danger { background: #b94747; }
        .small { padding: 7px 10px; font-size: 13px; }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .notice {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            margin: 16px 0;
            overflow-wrap: anywhere;
        }

        .success { display: block; background: #e7f5ec; color: #21663b; }
        .error { display: block; background: #fff0ef; color: #a22e27; }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th { background: #f8f9fa; }
        .count { color: #777; font-size: 14px; }

        .empty { padding: 24px; text-align: center; color: #888; }

        @media (max-width: 500px) {
            section { padding: 16px; }
            body { padding: 18px 10px; }
        }
    </style>
</head>
<body>
<main>
    <h1>🐱 ねこ管理システム</h1>
    <p class="subtitle">ねこの登録・検索・編集・削除ができます。</p>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <section>
        <h2>ねこを登録する</h2>
        <form id="register-form">
            <div class="form-grid">
                <div>
                    <label for="new-name">名前</label>
                    <input id="new-name" required maxlength="100"
                           placeholder="例：Mochi">
                </div>
                <div>
                    <label for="new-sex">性別</label>
                    <select id="new-sex" required>
                        <option value="female">メス</option>
                        <option value="male">オス</option>
                    </select>
                </div>
                <div>
                    <label for="new-age">年齢</label>
                    <input id="new-age" type="number" required min="0"
                           max="100" step="1" value="1">
                </div>
            </div>
            <button class="primary" type="submit">＋ 登録する</button>
        </form>
    </section>

    <section>
        <h2>ねこを検索する</h2>
        <p class="count">検索条件は1つだけ指定できます。</p>
        <form id="search-form">
            <div class="form-grid">
                <div>
                    <label for="search-name">名前</label>
                    <input id="search-name" placeholder="名前で検索">
                </div>
                <div>
                    <label for="search-sex">性別</label>
                    <select id="search-sex">
                        <option value="">指定なし</option>
                        <option value="female">メス</option>
                        <option value="male">オス</option>
                    </select>
                </div>
                <div>
                    <label for="search-age">年齢</label>
                    <input id="search-age" type="number" min="0"
                           max="100" step="1" placeholder="年齢で検索">
                </div>
            </div>
            <div class="actions" style="margin-top: 14px">
                <button type="submit">検索する</button>
                <button type="button" id="reset-search" class="secondary">
                    全件表示
                </button>
            </div>
        </form>
    </section>

    <section>
        <h2>ねこ一覧</h2>
        <p id="count" class="count">読み込み中...</p>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>名前</th>
                    <th>性別</th>
                    <th>年齢</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="cat-list">
                <tr>
                    <td colspan="4" class="empty">読み込み中...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const API = "/cats";
    const list = document.getElementById("cat-list");
    const count = document.getElementById("count");
    const notice = document.getElementById("notice");

    function showMessage(message, type = "success") {
        notice.textContent = message;
        notice.className = "notice " + type;
    }

    function clearMessage() {
        notice.textContent = "";
        notice.className = "notice";
    }

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();

        let data = null;
        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            data = text;
        }

        if (!response.ok) {
            const detail = typeof data === "string"
                ? data
                : data?.message || data?.error || "";
            throw new Error(
                `通信エラー（HTTP ${response.status}）` +
                (detail ? ": " + detail : "")
            );
        }

        return data;
    }

    function addCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
        return cell;
    }

    function makeInput(value, type = "text") {
        const input = document.createElement("input");
        input.type = type;
        input.value = value ?? "";
        if (type === "number") {
            input.min = "0";
            input.max = "100";
            input.step = "1";
            input.required = true;
        }
        return input;
    }

    function makeButton(label, className, handler) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = className;
        button.addEventListener("click", handler);
        return button;
    }

    function renderCats(cats) {
        list.replaceChildren();
        count.textContent = `${cats.length}匹`;

        if (cats.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 4;
            cell.className = "empty";
            cell.textContent = "ねこが見つかりませんでした。";
            row.appendChild(cell);
            list.appendChild(row);
            return;
        }

        cats.forEach(cat => {
            const row = document.createElement("tr");

            addCell(row, cat.name);
            addCell(row, cat.sex === "female" ? "メス" :
                         cat.sex === "male" ? "オス" : cat.sex);
            addCell(row, `${cat.age}歳`);

            const actions = addCell(row, "");
            actions.className = "actions";

            actions.appendChild(makeButton(
                "編集", "small secondary", () => editCat(cat)
            ));
            actions.appendChild(makeButton(
                "削除", "small danger", () => deleteCat(cat)
            ));

            list.appendChild(row);
        });
    }

    async function loadCats(query = "") {
        count.textContent = "読み込み中...";
        try {
            const cats = await request(API + query);
            renderCats(cats);
        } catch (error) {
            count.textContent = "読み込みに失敗しました";
            list.replaceChildren();
            showMessage(error.message, "error");
        }
    }

    document.getElementById("register-form")
        .addEventListener("submit", async event => {
            event.preventDefault();
            clearMessage();

            const cat = {
                name: document.getElementById("new-name").value.trim(),
                sex: document.getElementById("new-sex").value,
                age: Number(document.getElementById("new-age").value)
            };

            if (!cat.name || !Number.isInteger(cat.age) || cat.age < 0) {
                showMessage("名前と年齢を正しく入力してください。", "error");
                return;
            }

            try {
                await request(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(cat)
                });
                event.target.reset();
                document.getElementById("new-age").value = "1";
                showMessage(`${cat.name}を登録しました。`);
                await loadCats();
            } catch (error) {
                showMessage("登録できませんでした: " + error.message, "error");
            }
        });

    document.getElementById("search-form")
        .addEventListener("submit", async event => {
            event.preventDefault();
            clearMessage();

            const name = document.getElementById("search-name").value.trim();
            const sex = document.getElementById("search-sex").value;
            const ageValue = document.getElementById("search-age").value;
            const selected = [Boolean(name), Boolean(sex), ageValue !== ""]
                .filter(Boolean).length;

            if (selected > 1) {
                showMessage("検索条件は1つだけ指定してください。", "error");
                return;
            }

            let query = "";
            if (name) query = "?name=" + encodeURIComponent(name);
            else if (sex) query = "?sex=" + encodeURIComponent(sex);
            else if (ageValue !== "")
                query = "?age=" + encodeURIComponent(ageValue);

            await loadCats(query);
        });

    document.getElementById("reset-search")
        .addEventListener("click", () => {
            document.getElementById("search-form").reset();
            clearMessage();
            loadCats();
        });

    async function editCat(cat) {
        clearMessage();

        const sex = prompt(
            "性別を入力してください（male または female）",
            cat.sex
        );
        if (sex === null) return;

        if (!["male", "female"].includes(sex.trim().toLowerCase())) {
            showMessage("性別は male または female で入力してください。", "error");
            return;
        }

        const ageText = prompt("年齢を入力してください", String(cat.age));
        if (ageText === null) return;

        const age = Number(ageText);
        if (ageText.trim() === "" || !Number.isInteger(age) ||
            age < 0 || age > 100) {
            showMessage("年齢は0〜100の整数で入力してください。", "error");
            return;
        }

        try {
            await request(API + "/" + encodeURIComponent(cat.name), {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: cat.name,
                    sex: sex.trim().toLowerCase(),
                    age
                })
            });
            showMessage(`${cat.name}を更新しました。`);
            await loadCats();
        } catch (error) {
            showMessage("更新できませんでした: " + error.message, "error");
        }
    }

    async function deleteCat(cat) {
        if (!confirm(`${cat.name}を削除しますか？`)) return;
        clearMessage();

        try {
            await request(API + "/" + encodeURIComponent(cat.name), {
                method: "DELETE"
            });
            showMessage(`${cat.name}を削除しました。`);
            await loadCats();
        } catch (error) {
            showMessage("削除できませんでした: " + error.message, "error");
        }
    }

    loadCats();
</script>
</body>
</html>
